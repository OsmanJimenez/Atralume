<div hidden>
  <ng-content />
</div>
<nav [attr.aria-label]="label() + ' steps'">
  <tui-stepper
    [orientation]="orientation()"
    [activeItemIndex]="activeIndex()"
    (activeItemIndexChange)="onIndex($event)"
  >
    @for (step of steps(); track step.stepId(); let index = $index) {
      <button
        tuiStep
        data-step-header
        type="button"
        [id]="step.stepId() + '-header'"
        [stepState]="step.stepState()"
        [icon]="step.icon()"
        [disabled]="disabled() || step.disabled()"
        [attr.aria-controls]="
          activeIndex() === index ? step.stepId() + '-panel' : null
        "
        [attr.aria-current]="activeIndex() === index ? 'step' : null"
      >
        {{ step.label() }}
      </button>
    }
  </tui-stepper>
</nav>
@if (activeStep(); as step) {
  <section
    class="atr-step-content"
    role="region"
    [id]="step.stepId() + '-panel'"
    [attr.aria-labelledby]="step.stepId() + '-header'"
    tabindex="-1"
  >
    @if (step.content(); as content) {
      <ng-container [ngTemplateOutlet]="content" />
    }
  </section>
}
