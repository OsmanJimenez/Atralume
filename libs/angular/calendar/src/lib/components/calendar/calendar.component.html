@if (selectionMode() === "range") {
  <tui-calendar-range
    [attr.aria-label]="label()"
    [value]="tuiRange()"
    (valueChange)="onRange($event)"
    [month]="tuiMonth()"
    (monthChange)="onMonth($event)"
    [min]="tuiMin()"
    [max]="tuiMax()"
    [disabledItemHandler]="disabledItemHandler()"
  />
} @else {
  <tui-calendar
    [attr.aria-label]="label()"
    [value]="tuiDay()"
    [month]="tuiMonth()"
    (monthChange)="onMonth($event)"
    [min]="tuiMin()"
    [max]="tuiMax()"
    [showAdjacent]="showAdjacentDays()"
    [disabledItemHandler]="disabledItemHandler()"
    (dayClick)="onDayClick($event)"
  />
}
