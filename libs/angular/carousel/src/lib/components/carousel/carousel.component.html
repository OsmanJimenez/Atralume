<section role="region" [attr.aria-label]="label()" aria-roledescription="carousel">
  <tui-carousel
    [index]="activeIndex()"
    (indexChange)="onIndex($event)"
    [duration]="duration()"
    [min]="0"
    [max]="max()"
  >
    @for (slide of slides(); track slide.id; let index = $index) {
      <div *tuiItem class="atr-carousel__slide" role="group" aria-roledescription="slide">
        <h3>{{ slide.label }}</h3>
        @if (slide.description) {
          <p>{{ slide.description }}</p>
        }
      </div>
    }
  </tui-carousel>
  <div class="atr-carousel__controls">
    <button atrButton type="button" appearance="text" aria-label="Previous slide" (click)="previous()">
      Previous
    </button>
    <button atrButton type="button" appearance="text" aria-label="Next slide" (click)="next()">
      Next
    </button>
  </div>
  @if (showIndicators()) {
    <div class="atr-carousel__indicators" role="tablist" aria-label="Choose slide">
      @for (slide of slides(); track slide.id; let index = $index) {
        <button
          atrButton
          type="button"
          appearance="text"
          role="tab"
          [attr.aria-selected]="index === activeIndex()"
          [attr.aria-label]="'Go to slide ' + (index + 1)"
          (click)="onIndex(index)"
        >
          {{ index + 1 }}
        </button>
      }
    </div>
  }
</section>
