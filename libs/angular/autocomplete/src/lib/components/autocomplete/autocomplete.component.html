  [value]="value()"

  [multiple]="multiple()"

  [(opened)]="opened"
  [(query)]="query"
  [placeholder]="placeholder()"
  [clearable]="clearable()"
  [loading]="loading()"

  [compareWith]="compareWith()"
  [displayWith]="displayWith()"
  [display]="display()"

  [minimumCharacters]="minimumCharacters()"
