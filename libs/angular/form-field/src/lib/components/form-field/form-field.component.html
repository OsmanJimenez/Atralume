<label class="atr-form-field__label" [attr.for]="control()?.controlId()">
  {{ label() }}
  @if (required()) {
    <span aria-hidden="true">*</span>
  } @else if (optional()) {
    <span class="atr-form-field__optional">{{ optionalText() }}</span>
  }
</label>
<ng-content />
@if (hint()) {
  <p class="atr-form-field__hint" [id]="hintId()">{{ hint() }}</p>
}
@if (error()) {
  <p class="atr-form-field__error" [id]="errorId()" aria-live="polite">
    {{ error() }}
  </p>
}
