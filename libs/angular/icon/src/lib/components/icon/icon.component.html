@if (resolvedEngine() === "tui") {
  <!--
    Paint Lucide assets with a plain CSS mask. Taiga <tui-icon> masks fail to
    show stroke SVGs reliably under Chromium when served as static files; the
    same URLs paint correctly with mask + background:currentColor.
  -->
  <span
    class="atr-icon__tui-glyph"
    [style.--atr-tui-mask]="tuiMaskUrl()"
    aria-hidden="true"
  ></span>
} @else if (definition(); as icon) {
  <svg
    [attr.viewBox]="icon.viewBox || '0 0 24 24'"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
    focusable="false"
  >
    @for (path of icon.paths; track $index) {
      <path [attr.d]="path" />
    }
  </svg>
}
