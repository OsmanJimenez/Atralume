@if (resolvedEngine() === "tui") {
  <tui-icon [icon]="name()" />
} @else if (definition(); as icon) {
  <svg
    [attr.viewBox]="icon.viewBox || '0 0 24 24'"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
    focusable="false"
  >
    @for (path of icon.paths; track $index) {
      <path [attr.d]="path" />
    }
  </svg>
}
