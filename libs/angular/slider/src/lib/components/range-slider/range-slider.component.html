<span class="range-label">{{ label() }}</span>
<tui-range
  data-atr-value-control
  [formControl]="inner"
  [min]="minimum()"
  [max]="maximum()"
  [step]="rangeStep()"
  [segments]="segments()"
  [focusable]="!readonly()"
  [attr.aria-label]="label()"
  [attr.aria-invalid]="displayInvalid()"
  [attr.aria-readonly]="readonly()"
  [attr.aria-orientation]="orientation()"
/>
<output
  >{{ displayWith()(displayed().start) }} –
  {{ displayWith()(displayed().end) }}</output
>
@if (hint()) {
  <p>{{ hint() }}</p>
}
@if (error()) {
  <p role="status">{{ error() }}</p>
}
