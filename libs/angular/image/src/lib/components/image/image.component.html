@if (isEmpty()) {
  <div class="atr-image__error" role="img" [attr.aria-label]="alt()">
    No image
  </div>
} @else if (imageAvailable()) {
  @if (previewable()) {
    <button
      type="button"
      class="atr-image__trigger"
      [attr.aria-label]="previewLabel()"
      (click)="requestPreview($event)"
    >
      <img
        [src]="activeSrc()"
        [alt]="alt()"
        [loading]="loading()"
        [attr.width]="width()"
        [attr.height]="height()"
        [style.object-fit]="fit()"
        [style.object-position]="position()"
        (load)="loaded()"
        (error)="failed()"
      />
    </button>
  } @else {
    <img
      [src]="activeSrc()"
      [alt]="alt()"
      [loading]="loading()"
      [attr.width]="width()"
      [attr.height]="height()"
      [style.object-fit]="fit()"
      [style.object-position]="position()"
      (load)="loaded()"
      (error)="failed()"
    />
  }
} @else {
  <div class="atr-image__error" role="img" [attr.aria-label]="alt()">
    Image unavailable
  </div>
}
@if (state() === "loading" && imageAvailable()) {
  <atr-skeleton class="atr-image__skeleton" appearance="rounded" />
}
