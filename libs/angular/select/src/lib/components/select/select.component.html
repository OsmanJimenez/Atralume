<atr-form-field [hint]="hint()" [error]="error()">
  <tui-textfield
    tuiChevron
    [invalid]="displayInvalid()"
    [stringify]="stringify()"
    [identityMatcher]="identityMatcher()"
    [disabledItemHandler]="disabledItemHandler()"
    [tuiTextfieldCleaner]="clearable()"
    tuiTextfieldSize="m"
  >
    <label tuiLabel>
      {{ label() }}@if (required()) { *}
    </label>
    <input
      atrSelect
      [id]="controlId()"
      [placeholder]="placeholder()"
      [readOnly]="readonly()"
      [formControl]="inner"
    />
    <ng-template tuiDropdown>
      <tui-data-list-wrapper
        [items]="items()"
        [emptyContent]="emptyText()"
      />
    </ng-template>
  </tui-textfield>
</atr-form-field>
