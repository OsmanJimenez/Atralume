<button
  tuiAccordion
  type="button"
  [id]="id() + '-header'"
  [(tuiAccordion)]="expanded"
  [disabled]="disabled()"
>
  <ng-content select="[atrAccordionHeader]" />
</button>
<tui-expand [expanded]="expanded()">
  <div
    role="region"
    [id]="id() + '-panel'"
    [attr.aria-labelledby]="id() + '-header'"
  >
    <ng-content />
  </div>
</tui-expand>
