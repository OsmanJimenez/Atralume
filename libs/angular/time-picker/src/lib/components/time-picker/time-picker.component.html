<atr-form-field [hint]="hint()" [error]="error()">
  <tui-textfield
    [invalid]="displayInvalid()"
    [tuiTextfieldCleaner]="clearable()"
    tuiTextfieldSize="m"
  >
    <label tuiLabel>
      {{ label() }}@if (required()) { *}
    </label>
    <input
      tuiInputTime
      data-atr-value-control
      [id]="controlId()"
      [formControl]="inner"
      [mode]="mode()"
      [readOnly]="readonly()"
    />
  </tui-textfield>
</atr-form-field>
