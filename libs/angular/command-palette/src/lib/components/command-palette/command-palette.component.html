<ng-template #content>
  <section class="atr-command-palette-content">
    @if (canGoBack()) {
      <button atrButton appearance="text" type="button" (click)="back()">
        Back
      </button>
    }
    <atr-combobox
      [label]="label()"
      [options]="options()"
      [(query)]="query"
      [displayWith]="displayCommand"
      [value]="null"
      (valueChange)="choose($event)"
      [strict]="true"
      [filterOptions]="true"
      emptyText="No commands"
    />
  </section>
</ng-template>
