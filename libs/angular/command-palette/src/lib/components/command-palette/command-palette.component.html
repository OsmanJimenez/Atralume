<ng-template #content>
  <section class="atr-command-palette-content">
    @if (canGoBack()) {
      <button atrButton appearance="text" type="button" (click)="back()">
        Back
      </button>
    }
    <atr-combobox
      [label]="label()"
      [options]="options()"
      [inline]="true"
      [opened]="true"
      [(query)]="query"
      [loading]="loading()"
      [loadError]="loadError()"
      [displayWith]="displayCommand"
      [value]="null"
      (valueChange)="choose($event)"
      [optionTemplate]="commandOption"
    />
    <ng-template #commandOption let-command>
      <span>{{ command.label }}</span>
      @if (command.shortcut) {
        <kbd>{{ command.shortcut }}</kbd>
      }
      @if (command.children) {
        <atr-icon name="arrow-right" />
      }
    </ng-template>
  </section>
</ng-template>
