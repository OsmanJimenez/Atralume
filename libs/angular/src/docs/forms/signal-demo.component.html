<div class="atr-forms-demo">
  <atr-form-field>
    <tui-textfield tuiTextfieldSize="m">
      <label tuiLabel>Signal email</label>
      <input atrInput type="email" [formField]="fields.email" />
    </tui-textfield>
  </atr-form-field>
  <atr-form-field>
    <tui-textfield tuiTextfieldSize="m">
      <label tuiLabel>Signal notes</label>
      <textarea atrTextarea [formField]="fields.notes"></textarea>
    </tui-textfield>
  </atr-form-field>
  <label atrControlLabel
    ><input atrCheckbox type="checkbox" [formField]="fields.accepted" /><span
      >Accept terms</span
    ></label
  >
  <fieldset>
    <legend>Signal plan</legend>
    <label atrControlLabel
      ><input
        atrRadio
        type="radio"
        value="personal"
        [formField]="fields.plan"
      /><span>Personal</span></label
    ><label atrControlLabel
      ><input
        atrRadio
        type="radio"
        value="business"
        [formField]="fields.plan"
      /><span>Business</span></label
    >
  </fieldset>
  <label atrControlLabel
    ><input atrSwitch type="checkbox" [formField]="fields.notifications" /><span
      >Notifications</span
    ></label
  >
  <output
    >{{ model().email }} / {{ model().plan }} /
    {{ model().notifications }}</output
  >
</div>
