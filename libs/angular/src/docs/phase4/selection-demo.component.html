@switch (family()) {
  @case ("listbox") {
    <atr-listbox
      label="Available options"
      [options]="options()"
      [(value)]="selected"
      [disabled]="disabled()"
      [selectionMode]="multiple() ? 'multiple' : 'single'"
    />
    <output>Selected: {{ selected().join(", ") }}</output>
  }
  @case ("combobox") {
    <atr-combobox
      label="Choose a tool"
      [options]="options()"
      [formControl]="control"
      [displayWith]="display"
      [(query)]="query"
      [disabled]="disabled()"
      clearable
    />
  }
  @case ("select") {
    <atr-select
      label="Choose a tool"
      [options]="options()"
      [formControl]="control"
      [displayWith]="display"
      [disabled]="disabled()"
      clearable
    />
  }
  @case ("autocomplete") {
    <atr-autocomplete
      label="Search tools"
      [options]="options()"
      [formControl]="control"
      [displayWith]="display"
      [(query)]="query"
      [disabled]="disabled()"
      clearable
    />
  }
  @case ("popover") {
    <button
      atrButton
      atrPopover
      type="button"
      [atrPopover]="popoverPanel"
      [(opened)]="opened"
      panelRole="dialog"
      label="Edit details"
      [disabled]="disabled()"
    >
      Open details
    </button>
    <ng-template #popoverPanel>
      <div class="atr-popover-content">
        <atr-form-field>
          <tui-textfield tuiTextfieldSize="m">
            <label tuiLabel>Name</label>
            <input atrInput value="Alex" />
          </tui-textfield>
        </atr-form-field>
        <button atrButton type="button" (click)="opened.set(false)">
          Save details
        </button>
      </div>
    </ng-template>
  }
  @case ("command-palette") {
    <button
      atrButton
      type="button"
      [disabled]="disabled()"
      (click)="palette.open($any($event.currentTarget))"
    >
      Open commands</button
    ><atr-command-palette
      #palette
      [commands]="empty() ? [] : commands"
      [loading]="loading()"
      [loadError]="error() ? 'Commands could not be loaded' : null"
      [opened]="loading() || empty() || error()"
      (invoked)="result.set($event.label)"
    />
  }
}
@if (family() !== "listbox") {
  <output>Value: {{ result() }}</output>
}
