<div [attr.aria-label]="label()" role="presentation">
  <tui-tree
    [value]="nodes()"
    [childrenHandler]="childrenOf"
    [content]="content()"
    [tuiTreeController]="expandAll()"
  />
</div>
<ng-template #node let-item>
  @if (isNode(item)) {
    <button
      type="button"
      class="atr-tree__label"
      [class.atr-tree__label--selected]="isSelected(item)"
      [disabled]="item.disabled || null"
      (click)="select(item, $event)"
    >
      {{ item.label }}
      @if (item.loading) {
        <span role="status" aria-label="Loading children">…</span>
      }
    </button>
  }
</ng-template>
