<section [attr.aria-label]="label">
  @if (image(); as current) {
    <header>
      <div>
        @if (current.title) {
          <h2>{{ current.title }}</h2>
        }
        @if (current.description) {
          <p>{{ current.description }}</p>
        }
      </div>
      <button atrButton type="button" appearance="text" (click)="close()">
        Close
      </button>
    </header>
    <tui-preview [zoomable]="zoomable" [rotatable]="rotatable"
      ><img
        [src]="
          failedSource() === current.src ? current.fallbackSrc : current.src
        "
        [alt]="current.alt"
        (error)="failed()"
    /></tui-preview>
  }
  <footer>
    @if (hasPrevious()) {
      <button atrButton type="button" appearance="text" (click)="previous()">
        Previous
      </button>
    }
    <span>{{ activeIndex() + 1 }} / {{ data.images.length }}</span>
    @if (hasNext()) {
      <button atrButton type="button" appearance="text" (click)="next()">
        Next
      </button>
    }
  </footer>
</section>
