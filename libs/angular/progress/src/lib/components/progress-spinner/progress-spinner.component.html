@if (value() === null) {
  <tui-loader
    class="atr-progress-spinner__loader"
    [size]="tuiSize()"
    [inheritColor]="true"
    [overlay]="false"
  />
} @else {
  <tui-progress-circle
    class="atr-progress-spinner__circle"
    [value]="circleValue()"
    [max]="circleMax()"
    [size]="tuiSize()"
  />
}
