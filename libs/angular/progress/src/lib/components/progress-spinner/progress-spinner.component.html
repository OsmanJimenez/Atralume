<svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
  <circle class="track" cx="20" cy="20" r="16" />
  <circle
    class="indicator"
    cx="20"
    cy="20"
    r="16"
    pathLength="100"
    [attr.stroke-dasharray]="percentage() === null ? '25 75' : '100 100'"
    [attr.stroke-dashoffset]="
      percentage() === null ? 0 : 100 - (percentage() ?? 0)
    "
  />
</svg>
