<atr-form-field [hint]="hint()" [error]="error()">
  @if (selectionMode() === "range") {
    <tui-textfield
      [invalid]="displayInvalid()"
      [tuiTextfieldCleaner]="clearable()"
      [disabledItemHandler]="disabledItemHandler()"
      tuiTextfieldSize="m"
    >
      <label tuiLabel>
        {{ label() }}@if (required()) { *}
      </label>
      <input
        tuiInputDateRange
        data-atr-value-control
        [id]="controlId()"
        [formControl]="range"
        [min]="tuiMin()"
        [max]="tuiMax()"
        [readOnly]="readonly()"
      />
      <ng-template tuiDropdown>
        <tui-calendar-range />
      </ng-template>
    </tui-textfield>
  } @else {
    <tui-textfield
      [invalid]="displayInvalid()"
      [tuiTextfieldCleaner]="clearable()"
      [disabledItemHandler]="disabledItemHandler()"
      tuiTextfieldSize="m"
    >
      <label tuiLabel>
        {{ label() }}@if (required()) { *}
      </label>
      <input
        tuiInputDate
        data-atr-value-control
        [id]="controlId()"
        [formControl]="single"
        [min]="tuiMin()"
        [max]="tuiMax()"
        [readOnly]="readonly()"
      />
      <ng-template tuiDropdown>
        <tui-calendar />
      </ng-template>
    </tui-textfield>
  }
</atr-form-field>
