name: Accessibility report
description: Report an accessibility barrier or regression privately when appropriate.
title: "a11y: "
labels: [accessibility, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Do not include sensitive details. See SECURITY.md for private reporting."
  - type: textarea
    id: barrier
    attributes:
      label: Barrier and affected component
      description: Include assistive technology, browser, expected outcome, and actual outcome.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
