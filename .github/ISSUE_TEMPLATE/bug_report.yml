name: Bug report
description: Report a reproducible defect in Atralume.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal repository, StackBlitz, or exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Atralume, Angular, browser, and OS versions
    validations:
      required: true
