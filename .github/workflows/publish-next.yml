name: Atralume Publish Next

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atralume-publish-next
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: npm-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: git fetch origin develop --depth=1
      - run: npm run release:status
      - run: node tools/check-release-context.mjs next
      - run: npm run verify
      - run: npm run release:dry-run
      - run: npm publish dist/libs/angular --tag next --provenance --access public
