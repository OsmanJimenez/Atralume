name: Atralume Publish Stable

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: atralume-publish-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: npm-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: git fetch origin master develop --depth=1
      - run: npm ci
      - run: npm run release:status
      - run: node tools/check-release-context.mjs stable
      - run: npm run verify
      - run: npm run release:dry-run
      - run: npm publish dist/libs/angular --tag latest --provenance --access public
